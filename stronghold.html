<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Stronghold Triangulator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="centering-container">
            <a href="index.html">
                <button type="button" class="nav-button">Home</button>
            </a>
            
            <a href="portfolio.html">
                <button type="button" class="nav-button">Portfolio</button>
            </a>

            <a href="stronghold.html">
                <button type="button" class="nav-button">Stronghold Triangulator</button>
            </a>
        </div> 

        <div class="about-content">
            <div class="stronghold-input-container">
                <div class="input-box">
                    <label for="x1_input">X1 coordinate</label>
                    <input type="text" id="x1_input" class="stronghold-input"/>
                </div>

                <div class="input-box">
                    <label for="y1_input">Y1 coordinate</label>
                    <input type="text" id="y1_input" class="stronghold-input"/>
                </div>

                <div class="input-box">
                    <label for="f1_input">Facing angle 1</label>
                    <input type="text" id="f1_input" class="stronghold-input"/>
                </div>

                <div class="input-box">
                    <label for="x2_input">X2 coordinate</label>
                    <input type="text" id="x2_input" class="stronghold-input"/>
                </div>

                <div class="input-box">
                    <label for="y2_input">Y2 coordinate</label>
                    <input type="text" id="y2_input" class="stronghold-input"/>
                </div>

                <div class="input-box">
                    <label for="f2_input">Facing angle 2</label>
                    <input type="text" id="f2_input" class="stronghold-input"/>
                </div>
            </div>
            <button type="button" class="stronghold-button" onclick="displayCoordinates()">submit</button>
        </div>

        <div class = "about-content">
            <div class="image-with-text">
                <img src="assets/ender_pearl.png" id="left-pearl">
                <div class="coordinate-text">
                    <p id="x-coordinate">?</p>
                </div>
            </div>

            <div class="image-with-text">
                <img src = "assets/ender_pearl.png" id="right-pearl">
                <div class="coordinate-text">
                    <p id="y-coordinate">?</p>
                </div>
            </div>
        </div>
        

        
        <!-- <p id="coordinate_display"></p> -->

        <script src="triangulator.js"></script> 
    </body>
</html>
